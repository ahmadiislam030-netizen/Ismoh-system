# fly.toml app configuration file generated for ismoh-system on 2026-11-13T06:20:28Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'ismoh-system'
primary_region = 'ams'

[build]
[[mounts]]
  source = 'data'
  destination = '/data'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
